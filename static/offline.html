<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#faf8ff" />
		<title>Sin conexión · FinFlow</title>
		<style>
			:root {
				color-scheme: light;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 24px;
				background: #faf8ff;
				color: #1b2537;
				font-family:
					Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			main {
				width: 100%;
				max-width: 360px;
				padding: 28px 24px;
				text-align: center;
				background: #ffffff;
				border: 1px solid #e6e4ee;
				border-radius: 24px;
				box-shadow:
					0 1px 3px rgb(15 23 42 / 0.04),
					0 4px 12px -2px rgb(15 23 42 / 0.03);
			}

			img {
				display: block;
				margin: 0 auto 18px;
				border-radius: 18px;
			}

			h1 {
				margin: 0;
				font-size: 22px;
				line-height: 1.25;
			}

			p {
				margin: 8px 0 22px;
				color: #5b6474;
				font-size: 14px;
				line-height: 1.5;
			}

			button {
				width: 100%;
				height: 48px;
				border: 0;
				border-radius: 12px;
				background: #006c49;
				color: #ffffff;
				font: inherit;
				font-size: 15px;
				font-weight: 600;
				cursor: pointer;
				-webkit-tap-highlight-color: transparent;
			}

			button:active {
				transform: scale(0.985);
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/favicon.svg" alt="" width="72" height="72" />
			<h1>Sin conexión</h1>
			<p>
				FinFlow necesita conexión para mostrar tus datos. Revisa tu red y vuelve a intentarlo.
			</p>
			<button id="retry" type="button">Reintentar</button>
		</main>
		<script>
			document.getElementById('retry')?.addEventListener('click', () => location.reload());
		</script>
	</body>
</html>
